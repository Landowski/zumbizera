<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zumbizera</title>
<link rel="stylesheet" href="css/game.css">
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="img/favicon.png" type="image/png">
</head>
<body>

  <div id="rotate-device-overlay">
    <p id="rotateDeviceText" data-i18n="rotateDevice"></p>
  </div>

  <section id="lobby">

    <div id="roomSelect" class="fundo">
      <div class="menu">
        <div style="display: flex; gap: 15px;">
          <button id="createPrivateRoomBtn" data-i18n="private"></button>
          <button id="createPublicRoomBtn" data-i18n="public"></button>
        </div>
        <button id="publicRoomsBtn" data-i18n="publicRoomsBtn" style="width: 100%; background-color: #a038c4;"></button>
        <div class="join-row">
          <input type="text" id="roomCodeInput" data-i18n-placeholder="codePlaceholder" maxlength="4" autocomplete="off" placeholder="">
          <button id="joinRoomBtn" data-i18n="enter" style="background-color: #d7b73d"></button>
        </div>
        <p id="roomSelectStatus"></p>
      </div>
    </div>

    <div id="publicRoomsScreen" class="hidden" style="height: 80vh;">
      <button id="publicRoomsBackBtn" data-i18n="back" style="margin-bottom: 20px;"></button>
      <p id="publicRoomsStatus" style="margin-bottom: 20px;"></p>
      <div id="publicRoomsList"></div>
    </div>

    <div id="lobbyMain" class="hidden">
      <div class="left">
        <div class="jogadores" id="playerOptions">
          <div class="player-option selected" data-character="azul">
            <img src="img/j-1.webp"/>
          </div>
          <div class="player-option" data-character="verde">
            <img src="img/j-2.webp"/>
          </div>
          <div class="player-option" data-character="amarelo">
            <img src="img/j-3.webp"/>
          </div>
          <div class="player-option" data-character="laranja">
            <img src="img/j-4.webp"/>
          </div>
          <div class="player-option" data-character="rosa">
            <img src="img/j-5.webp"/>
          </div>
          <div class="player-option" data-character="roxo">
            <img src="img/j-6.webp"/>
          </div>
        </div>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="name" maxlength="15" autocomplete="off" style="width: 224px;">
          <span id="nameBlockedIcon" class="hidden">🛇</span>
        </div>
      </div>

      <div class="status">
        <p id="status"></p>
        <p id="roomCodeDisplay"></p>
        <p id="playerCount"></p>
        <div class="time hidden" id="time">
          <span id="minutesText" data-i18n="minutesLabel"></span>
          <div class="time-options" id="timeOptions">
            <div class="time-option" data-minutes="2">
              <span>2</span>
            </div>
            <div class="time-option" data-minutes="3">
              <span>3</span>
            </div>
            <div class="time-option" data-minutes="4">
              <span>4</span>
            </div>
            <div class="time-option" data-minutes="5">
              <span>5</span>
            </div>
          </div>
        </div>
        <div class="menuBtns">
          <button id="startBtn" data-i18n="start" class="hidden"></button>
          <button id="lobbyLeaveBtn" data-i18n="leave" class="hidden"></button>
        </div>
      </div>
    </div>

  </section>
 
  <section id="game" class="hidden">
    <div id="hud" class="hidden">
      <span id="timer">--</span>
    </div>
    <div id="countdownOverlay" class="countdown-overlay hidden">
      <span id="countdownText" class="countdown-text"></span>
    </div>
    <canvas id="canvas" width="1376" height="768"></canvas>
 
    <div id="joystickZone" class="hidden">
      <div id="joystickThumb"></div>
    </div>
    <button id="sprintBtn" class="hidden"><img src="img/item-corrida.webp" width="auto" height="30"/></button>
    <button id="actionBtn" class="hidden"><img src="img/item-lampada.webp" width="auto" height="30"/></button>
 
    <div id="gameOver" class="hidden">
      <p id="gameOverText"></p>
      <button id="restartBtn" data-i18n="restart" class="hidden"></button>
      <button id="leaveBtn" data-i18n="leaveRoom"></button>
    </div>
  </section>

  <script src="js/firebase-app-compat.js"></script>
  <script src="js/firebase-auth-compat.js"></script>
  <script src="js/firebase-firestore-compat.js"></script>
  <script src="js/peerjs.js"></script>
  <script src="js/config.js"></script>
  <script src="js/rooms-data.js"></script>
  <script src="js/sprites-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/name-filter.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/network.js"></script>
  <script src="js/game.js"></script>
  
</body>
</html>
